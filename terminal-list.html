<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0f14">
<title>The Terminal List — Episodes</title>
<style>
:root{color-scheme:dark;--bg:#0b0f14;--panel:#141b24;--line:#263241;--muted:#9aa7b8;--text:#f2f4f7;--accent:#e0b35a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:28px 5vw 18px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:clamp(1.8rem,5vw,2.6rem)}
.sub{color:var(--muted);font-size:.9rem;margin-top:6px}
main{max-width:1100px;margin:auto;padding:20px 5vw 60px}
#player-wrap{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0;border-bottom:1px solid var(--line)}
#player{width:100%;max-height:60vh;background:#000;border-radius:12px;display:block}
#now{margin:10px 0 0;color:var(--muted);font-size:.9rem;min-height:1.4em}
#now strong{color:var(--text)}
h2{font-size:1.2rem;margin:34px 0 14px;color:var(--accent);letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ep{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.ep .code{font-size:.75rem;font-weight:800;letter-spacing:.08em;color:var(--accent)}
.ep .name{font-weight:650;font-size:1rem}
.ep .file{color:var(--muted);font-size:.72rem;word-break:break-all;line-height:1.35}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.actions .btn{flex:1 1 auto}
.btn{border:0;border-radius:9px;padding:10px 12px;font:600 .9rem system-ui,sans-serif;text-decoration:none;cursor:pointer;text-align:center}
.play{background:var(--accent);color:#17120a;flex:1}
.play[aria-pressed="true"]{background:#fff}
.alt{background:#243143;color:var(--text)}
.btn:focus-visible{outline:3px solid #7fa6e0;outline-offset:3px}
footer{color:var(--muted);font-size:.8rem;margin-top:36px;border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<header>
  <h1>The Terminal List</h1>
  <div class="sub">Season 1 and Season 2 · 16 episodes · Tap “Play in MPV” or “Play in VLC” to open each MKV link</div>
</header>

<main>
  <div id="seasons"></div>

  <footer>
    “Play in MPV” and “Play in VLC” launch the episode in that app on Android. If Brave blocks them, use “Video link” and choose your player from Android’s share/open-with menu.
  </footer>
</main>

<script>
const BASE = "https://cdn.pixeldrain.eu.cc/";
const episodes = [
  { season: 1, ep: 1, id: "29PCxmvM", file: "The.Terminal.List.S01E01.1080p.10bit.WEBRip.6CH.x265.HEV.mkv" },
  { season: 1, ep: 2, id: "Kqie7b8C", file: "The.Terminal.List.S01E02.1080p.10bit.WEBRip.6CH.x265.HEV.mkv" },
  { season: 1, ep: 3, id: "3AEfD72Z", file: "The.Terminal.List.S01E03.1080p.10bit.WEBRip.6CH.x265.HEV.mkv" },
  { season: 1, ep: 4, id: "nmTQmJtp", file: "The.Terminal.List.S01E04.1080p.10bit.WEBRip.6CH.x265.HEV.mkv" },
  { season: 1, ep: 5, id: "kmXM2aKe", file: "The.Terminal.List.S01E05.1080p.10bit.WEBRip.6CH.x265.HEV.mkv" },
  { season: 1, ep: 6, id: "KkfWMeGq", file: "The.Terminal.List.S01E06.1080p.10bit.WEBRip.6CH.x265.HEV.mkv" },
  { season: 1, ep: 7, id: "2h7Ju2Tt", file: "The.Terminal.List.S01E07.1080p.10bit.WEBRip.6CH.x265.HEV.mkv" },
  { season: 1, ep: 8, id: "AeFVnwSi", file: "The.Terminal.List.S01E08.1080p.10bit.WEBRip.6CH.x265.HEV.mkv" },
  { season: 2, ep: 1, id: "4N4k5HE6", file: "The.Terminal.List.S02E01.1080p.10bit.WEBRip.6CH.x265.HEV.mkv" },
  { season: 2, ep: 2, id: "MpiNH73a", file: "The.Terminal.List.S02E02.1080p.10bit.WEBRip.6CH.x265.HEV.mkv" },
  { season: 2, ep: 3, id: "MY1gnbPb", file: "The.Terminal.List.S02E03.1080p.10bit.WEBRip.6CH.x265.HEV.mkv" },
  { season: 2, ep: 4, id: "oERB8Wmd", file: "The.Terminal.List.S02E04.1080p.10bit.WEBRip.6CH.x265.HEV.mkv" },
  { season: 2, ep: 5, id: "88N1xAnZ", file: "The.Terminal.List.S02E05.1080p.10bit.WEBRip.6CH.x265.HEV.mkv" },
  { season: 2, ep: 6, id: "zvZe4B9K", file: "The.Terminal.List.S02E06.1080p.10bit.WEBRip.6CH.x265.HEV.mkv" },
  { season: 2, ep: 7, id: "3YXLqASp", file: "The.Terminal.List.S02E07.1080p.10bit.WEBRip.6CH.x265.HEV.mkv" },
  { season: 2, ep: 8, id: "BQcABKHa", file: "The.Terminal.List.S02E08.1080p.10bit.WEBRip.6CH.x265.HEV.mkv" }
];

const MPV_PACKAGE = "live.mehiz.mpvkt";
const VLC_PACKAGE = "org.videolan.vlc";
const container = document.getElementById("seasons");

function intentFor(url, pkg){
  const u = new URL(url);
  return "intent://" + u.host + u.pathname + u.search + u.hash +
    "#Intent;scheme=" + u.protocol.slice(0,-1) +
    ";type=video/*;package=" + pkg + ";end";
}

function code(e){
  return "S" + String(e.season).padStart(2, "0") + "E" + String(e.ep).padStart(2, "0");
}

[1, 2].forEach(season => {
  const h = document.createElement("h2");
  h.textContent = "Season " + season;
  const grid = document.createElement("div");
  grid.className = "grid";
  episodes.filter(e => e.season === season).forEach(e => {
    const card = document.createElement("article");
    card.className = "ep";

    const c = document.createElement("div");
    c.className = "code";
    c.textContent = code(e);

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = "Episode " + e.ep;

    const file = document.createElement("div");
    file.className = "file";
    file.textContent = e.file;

    const actions = document.createElement("div");
    actions.className = "actions";

    const play = document.createElement("a");
    play.className = "btn play";
    play.textContent = "▶ Play in MPV";
    play.href = intentFor(BASE + e.id, MPV_PACKAGE);

    const vlc = document.createElement("a");
    vlc.className = "btn play";
    vlc.textContent = "▶ Play in VLC";
    vlc.href = intentFor(BASE + e.id, VLC_PACKAGE);

    const open = document.createElement("a");
    open.className = "btn alt";
    open.textContent = "Video link";
    open.href = BASE + e.id;
    open.target = "_blank";
    open.rel = "noopener";

    actions.append(play, vlc, open);
    card.append(c, name, file, actions);
    grid.append(card);
  });
  container.append(h, grid);
});
</script>
</body>
</html>
